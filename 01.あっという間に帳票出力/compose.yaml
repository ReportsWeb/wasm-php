name: reports-web-php-01
services:
  engine:
    image: ghcr.io/reportsweb/engine:1.0.1
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3107/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 40
  php:
    build:
      context: .
    environment:
      REPORTS_ENGINE_URL: http://engine:3107
      XDEBUG_MODE: 'off'
    volumes:
    - type: bind
      source: .
      target: /app
      read_only: true
      bind:
        create_host_path: false
    - type: volume
      source: reports-web-runtime
      target: /opt/reports/web
      read_only: true
    depends_on:
      engine:
        condition: service_healthy
      runtime:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - '$$s = @fsockopen(''127.0.0.1'', 8080, $$e, $$m, 2); exit($$s ? 0 : 1);'
      interval: 2s
      timeout: 5s
      retries: 40
    ports:
    - 127.0.0.1:${SAMPLE_PORT:-19200}:8080
  runtime:
    image: ghcr.io/reportsweb/engine:1.0.1
    user: root
    command:
    - export-runtime
    volumes:
    - type: volume
      source: reports-web-runtime
      target: /export
volumes:
  reports-web-runtime: {}
