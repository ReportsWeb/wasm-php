# The PHP program and private inputs are outside the document root.
RedirectMatch 302 ^/$ /demo/reports.web/sample/php/
Alias /demo/reports.web/sample/php/ /opt/reports/php/public/
Alias /demo/reports.web/preview/ /opt/reports/web/preview/
Alias /demo/reports.web/design/ /opt/reports/web/design/
Alias /demo/reports.web/assets/ /opt/reports/web/assets/
Alias /demo/reports.web/barcode/ /opt/reports/web/barcode/
Alias /demo/reports.web/fonts/ /opt/reports/web/fonts/
Alias /demo/reports.web/font-map.json /opt/reports/web/font-map.json
Alias /demo/reports.web/preview-help.html /opt/reports/web/preview-help.html
<Directory /opt/reports/php/public>
    Require all granted
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
</Directory>
<Directory /opt/reports/web>
    Require all granted
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
</Directory>
AddType application/wasm .wasm
AddType text/javascript .mjs
