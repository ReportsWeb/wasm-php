name: reports-web-php-03
services:
  engine:
    restart: unless-stopped
    image: ghcr.io/reportsweb/engine:1.1.0
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3107/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 40
  php:
    build:
      context: ./api
    environment:
      REPORTS_ENGINE_URL: http://engine:3107
      XDEBUG_MODE: 'off'
      REPORTS_DATABASE_URL: pgsql:host=database;port=5432;dbname=reports_web_sample
      REPORTS_DATABASE_USER: reports_web
      REPORTS_DATABASE_PASSWORD: reports-web-local-only
    volumes:
    - type: bind
      source: ./api/public
      target: /opt/reports/php/public
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./api/src
      target: /opt/reports/php/src
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./api/resources
      target: /opt/reports/php/resources
      read_only: true
      bind:
        create_host_path: false
    - type: volume
      source: reports-web-runtime
      target: /opt/reports/web
      read_only: true
    depends_on:
      engine:
        condition: service_healthy
      database:
        condition: service_healthy
      runtime:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - '$$s = @fsockopen(''127.0.0.1'', 80, $$e, $$m, 2); exit($$s ? 0 : 1);'
      interval: 2s
      timeout: 5s
      retries: 40
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reports_web_sample
      POSTGRES_USER: reports_web
      POSTGRES_PASSWORD: reports-web-local-only
    volumes:
    - type: bind
      source: ../common/database/001_schema.sql
      target: /docker-entrypoint-initdb.d/001_schema.sql
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../common/database/002_seed.sql
      target: /docker-entrypoint-initdb.d/002_seed.sql
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../common/database/003_framework_excel.sql
      target: /docker-entrypoint-initdb.d/003_framework_excel.sql
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U reports_web -d reports_web_sample
      interval: 2s
      timeout: 3s
      retries: 40
  client:
    image: nginx:1.27-alpine
    ports:
    - 127.0.0.1:${SAMPLE_PORT:-19202}:8080
    environment:
      REPORTS_LANGUAGE: PHP
      REPORTS_API_URL: http://php/demo/reports.web/sample/php/api.php
      REPORTS_PREVIEW_URL: http://php/demo/reports.web/preview/
      REPORTS_APP_URL: http://php
    volumes:
    - type: bind
      source: ./client/index.html
      target: /usr/share/nginx/html/index.html
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./client/nginx.conf.template
      target: /etc/nginx/templates/default.conf.template
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/
      interval: 2s
      timeout: 3s
      retries: 30
  runtime:
    image: ghcr.io/reportsweb/engine:1.1.0
    user: root
    command:
    - export-runtime
    volumes:
    - type: volume
      source: reports-web-runtime
      target: /export
volumes:
  reports-web-runtime: {}
